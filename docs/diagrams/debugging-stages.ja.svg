<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc" xml:lang="ja">
  <!-- Copyright (c) 2026 The kirimasim Authors -->
  <!-- SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception -->
  <title id="title">最初に失敗する段階を特定する</title>
  <desc id="desc">VPIを使わない通常のソース実行。parse、SIR変換・検証、ソース実行の順に確認し、失敗箇所に応じて診断を調べる。成功はその入力と版に対する根拠。</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans CJK JP", sans-serif; fill: #1e293b; }
    .heading { font-size: 21px; font-weight: 650; }
    .subtitle { font-size: 14px; fill: #475569; }
    .node-title { font-size: 17px; font-weight: 650; }
    .body { font-size: 15px; }
    .label { font-size: 13px; fill: #475569; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.6; }
    .wire { fill: none; stroke: #475569; stroke-width: 1.6; }
  </style>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="24" y="30" class="heading" text-anchor="start">最初に失敗する段階を特定する</text>
  <text x="24" y="54" class="subtitle" text-anchor="start">--vpiを使わない通常のソース実行</text>
  <g class="node" id="stage-0">
    <rect x="24" y="88" width="186" height="100" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="117.0" y="116" class="node-title" text-anchor="middle">1. parse</text>
  <text x="117.0" y="142" class="body" text-anchor="middle">前処理・型・階層</text>
  <text x="117.0" y="163" class="body" text-anchor="middle">の検査</text>
  </g>
  <g class="node" id="stage-1">
    <rect x="262" y="88" width="186" height="100" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="355.0" y="116" class="node-title" text-anchor="middle">2. --dump-sir</text>
  <text x="355.0" y="142" class="body" text-anchor="middle">SIRへ変換し</text>
  <text x="355.0" y="163" class="body" text-anchor="middle">検証器で確認</text>
  </g>
  <g class="node" id="stage-2">
    <rect x="500" y="88" width="186" height="100" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="593.0" y="116" class="node-title" text-anchor="middle">3. ソース実行</text>
  <text x="593.0" y="142" class="body" text-anchor="middle">出力と終了理由を</text>
  <text x="593.0" y="163" class="body" text-anchor="middle">期待と照合</text>
  </g>
  <g class="node" id="stage-3">
    <rect x="738" y="88" width="186" height="100" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="831.0" y="116" class="node-title" text-anchor="middle">この入力・版の根拠</text>
  <text x="831.0" y="142" class="body" text-anchor="middle">この実行での一致</text>
  <text x="831.0" y="163" class="body" text-anchor="middle">P1全体の達成とは別</text>
  </g>
  <path d="M 210 138 H 262" class="arrow"/>
  <polygon points="262.0,138.0 252.0,133.0 252.0,143.0" fill="#475569"/>
  <text x="236" y="129" class="label" text-anchor="middle">成功</text>
  <path d="M 448 138 H 500" class="arrow"/>
  <polygon points="500.0,138.0 490.0,133.0 490.0,143.0" fill="#475569"/>
  <text x="474" y="129" class="label" text-anchor="middle">成功</text>
  <path d="M 686 138 H 738" class="arrow"/>
  <polygon points="738.0,138.0 728.0,133.0 728.0,143.0" fill="#475569"/>
  <text x="712" y="129" class="label" text-anchor="middle">一致</text>
  <path d="M 117 188 V 250" class="arrow"/>
  <polygon points="117.0,250.0 112.0,240.0 122.0,240.0" fill="#475569"/>
  <text x="127" y="220" class="label" text-anchor="start">失敗</text>
  <g class="node" id="diagnostic-0">
    <rect x="24" y="250" width="186" height="116" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="117.0" y="278" class="node-title" text-anchor="middle">入力・frontの診断</text>
  <text x="117.0" y="304" class="body" text-anchor="middle">ファイル・型・階層</text>
  <text x="117.0" y="325" class="body" text-anchor="middle">ソース位置付きの</text>
  <text x="117.0" y="346" class="body" text-anchor="middle">診断を保存</text>
  </g>
  <path d="M 355 188 V 250" class="arrow"/>
  <polygon points="355.0,250.0 350.0,240.0 360.0,240.0" fill="#475569"/>
  <text x="365" y="220" class="label" text-anchor="start">失敗</text>
  <g class="node" id="diagnostic-1">
    <rect x="262" y="250" width="186" height="116" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="355.0" y="278" class="node-title" text-anchor="middle">変換・検証器の診断</text>
  <text x="355.0" y="304" class="body" text-anchor="middle">未対応のソースか</text>
  <text x="355.0" y="325" class="body" text-anchor="middle">内部の検証エラーか</text>
  <text x="355.0" y="346" class="body" text-anchor="middle">診断を確認</text>
  </g>
  <path d="M 593 188 V 250" class="arrow"/>
  <polygon points="593.0,250.0 588.0,240.0 598.0,240.0" fill="#475569"/>
  <text x="603" y="220" class="label" text-anchor="start">失敗・不一致</text>
  <g class="node" id="diagnostic-2">
    <rect x="500" y="250" width="186" height="116" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="593.0" y="278" class="node-title" text-anchor="middle">実行と観測の調査</text>
  <text x="593.0" y="304" class="body" text-anchor="middle">値・時刻・寿命</text>
  <text x="593.0" y="325" class="body" text-anchor="middle">終了理由・上限を</text>
  <text x="593.0" y="346" class="body" text-anchor="middle">元の設定で確認</text>
  </g>
  <text x="24" y="398" class="subtitle" text-anchor="start">元の入力と設定を保ち、診断と失敗した段階を合わせて記録します。</text>
</svg>
