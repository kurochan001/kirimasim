<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc" xml:lang="en">
  <!-- Copyright (c) 2026 The kirimasim Authors -->
  <!-- SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception -->
  <title id="title">Locate the first failing stage</title>
  <desc id="desc">For ordinary source runs without VPI, check parse, SIR lowering and verification, then simulation. Investigate the first failing stage. A matching run provides evidence for that input and revision.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans CJK JP", sans-serif; fill: #1e293b; }
    .heading { font-size: 21px; font-weight: 650; }
    .subtitle { font-size: 14px; fill: #475569; }
    .node-title { font-size: 17px; font-weight: 650; }
    .body { font-size: 15px; }
    .label { font-size: 13px; fill: #475569; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.6; }
    .wire { fill: none; stroke: #475569; stroke-width: 1.6; }
  </style>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="24" y="30" class="heading" text-anchor="start">Locate the first failing stage</text>
  <text x="24" y="54" class="subtitle" text-anchor="start">Ordinary source execution without --vpi</text>
  <g class="node" id="stage-0">
    <rect x="24" y="88" width="186" height="100" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="117.0" y="116" class="node-title" text-anchor="middle">1. parse</text>
  <text x="117.0" y="142" class="body" text-anchor="middle">Frontend checks</text>
  <text x="117.0" y="163" class="body" text-anchor="middle">and elaboration</text>
  </g>
  <g class="node" id="stage-1">
    <rect x="262" y="88" width="186" height="100" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="355.0" y="116" class="node-title" text-anchor="middle">2. --dump-sir</text>
  <text x="355.0" y="142" class="body" text-anchor="middle">Lower and verify</text>
  <text x="355.0" y="163" class="body" text-anchor="middle">the typed design</text>
  </g>
  <g class="node" id="stage-2">
    <rect x="500" y="88" width="186" height="100" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="593.0" y="116" class="node-title" text-anchor="middle">3. Simulation</text>
  <text x="593.0" y="142" class="body" text-anchor="middle">Compare output</text>
  <text x="593.0" y="163" class="body" text-anchor="middle">and termination</text>
  </g>
  <g class="node" id="stage-3">
    <rect x="738" y="88" width="186" height="100" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="831.0" y="116" class="node-title" text-anchor="middle">Scoped evidence</text>
  <text x="831.0" y="142" class="body" text-anchor="middle">This input/revision</text>
  <text x="831.0" y="163" class="body" text-anchor="middle">Not full P1 coverage</text>
  </g>
  <path d="M 210 138 H 262" class="arrow"/>
  <polygon points="262.0,138.0 252.0,133.0 252.0,143.0" fill="#475569"/>
  <text x="236" y="129" class="label" text-anchor="middle">success</text>
  <path d="M 448 138 H 500" class="arrow"/>
  <polygon points="500.0,138.0 490.0,133.0 490.0,143.0" fill="#475569"/>
  <text x="474" y="129" class="label" text-anchor="middle">success</text>
  <path d="M 686 138 H 738" class="arrow"/>
  <polygon points="738.0,138.0 728.0,133.0 728.0,143.0" fill="#475569"/>
  <text x="712" y="129" class="label" text-anchor="middle">matches</text>
  <path d="M 117 188 V 250" class="arrow"/>
  <polygon points="117.0,250.0 112.0,240.0 122.0,240.0" fill="#475569"/>
  <text x="127" y="220" class="label" text-anchor="start">fails</text>
  <g class="node" id="diagnostic-0">
    <rect x="24" y="250" width="186" height="116" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="117.0" y="278" class="node-title" text-anchor="middle">Input / frontend</text>
  <text x="117.0" y="304" class="body" text-anchor="middle">Files, types, hierarchy</text>
  <text x="117.0" y="325" class="body" text-anchor="middle">Keep the positioned</text>
  <text x="117.0" y="346" class="body" text-anchor="middle">diagnostic</text>
  </g>
  <path d="M 355 188 V 250" class="arrow"/>
  <polygon points="355.0,250.0 350.0,240.0 360.0,240.0" fill="#475569"/>
  <text x="365" y="220" class="label" text-anchor="start">fails</text>
  <g class="node" id="diagnostic-1">
    <rect x="262" y="250" width="186" height="116" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="355.0" y="278" class="node-title" text-anchor="middle">Lowering / verifier</text>
  <text x="355.0" y="304" class="body" text-anchor="middle">Unsupported source</text>
  <text x="355.0" y="325" class="body" text-anchor="middle">or internal invariant</text>
  <text x="355.0" y="346" class="body" text-anchor="middle">Read the diagnostic</text>
  </g>
  <path d="M 593 188 V 250" class="arrow"/>
  <polygon points="593.0,250.0 588.0,240.0 598.0,240.0" fill="#475569"/>
  <text x="603" y="220" class="label" text-anchor="start">fails / differs</text>
  <g class="node" id="diagnostic-2">
    <rect x="500" y="250" width="186" height="116" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="593.0" y="278" class="node-title" text-anchor="middle">Execution / output</text>
  <text x="593.0" y="304" class="body" text-anchor="middle">Values, timing, lifetime</text>
  <text x="593.0" y="325" class="body" text-anchor="middle">Termination and limits</text>
  <text x="593.0" y="346" class="body" text-anchor="middle">Keep original options</text>
  </g>
  <text x="24" y="398" class="subtitle" text-anchor="start">Keep the original inputs and options; interpret each diagnostic together with its stage.</text>
</svg>
