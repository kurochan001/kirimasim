<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc" xml:lang="ja">
  <!-- Copyright (c) 2026 The kirimasim Authors -->
  <!-- SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception -->
  <title id="title">待機中の値は誰が保持するか</title>
  <desc id="desc">待機する対応済み制御の比較。ブロッキング代入は型付きフレームが右辺を保持し、プロセスが待った後に代入先を選ぶ。イベント制御付きNBAは右辺、代入先、イベント制御を保留処理へ渡し、発行元は予約後に続行する。矢印は所有と処理順で、時間幅やリージョン順ではない。</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans CJK JP", sans-serif; fill: #1e293b; }
    .heading { font-size: 21px; font-weight: 650; }
    .subtitle { font-size: 14px; fill: #475569; }
    .node-title { font-size: 17px; font-weight: 650; }
    .body { font-size: 15px; }
    .label { font-size: 13px; fill: #475569; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.6; }
    .wire { fill: none; stroke: #475569; stroke-width: 1.6; }
  </style>
  <rect width="960" height="530" fill="#ffffff"/>
  <text x="24" y="30" class="heading" text-anchor="start">待機中の値は誰が保持するか</text>
  <text x="24" y="54" class="subtitle" text-anchor="start">待機する対応済み制御の比較。矢印は処理順と所有関係で、時間幅やリージョン順ではありません。</text>
  <text x="32" y="92" class="node-title" text-anchor="start">ブロッキングの代入内制御</text>
  <rect x="24" y="106" width="912" height="156" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g class="node" id="blocking-0">
    <rect x="48" y="120" width="248" height="116" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="172.0" y="148" class="node-title" text-anchor="middle">右辺を捕捉</text>
  <text x="172.0" y="174" class="body" text-anchor="middle">型付きフレームに保存</text>
  <text x="172.0" y="195" class="body" text-anchor="middle">集約・コンテナの</text>
  <text x="172.0" y="216" class="body" text-anchor="middle">スナップショット</text>
  </g>
  <g class="node" id="blocking-1">
    <rect x="356" y="120" width="248" height="116" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="480.0" y="148" class="node-title" text-anchor="middle">待機する</text>
  <text x="480.0" y="174" class="body" text-anchor="middle">発行元プロセスが停止</text>
  <text x="480.0" y="195" class="body" text-anchor="middle">フレームが値を保持</text>
  </g>
  <g class="node" id="blocking-2">
    <rect x="664" y="120" width="248" height="116" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="788.0" y="148" class="node-title" text-anchor="middle">代入先を選び書込む</text>
  <text x="788.0" y="174" class="body" text-anchor="middle">待機後に代入先を選ぶ</text>
  <text x="788.0" y="195" class="body" text-anchor="middle">保存した右辺で更新</text>
  </g>
  <path d="M 296 178 H 356" class="arrow"/>
  <polygon points="356.0,178.0 346.0,173.0 346.0,183.0" fill="#475569"/>
  <path d="M 604 178 H 664" class="arrow"/>
  <polygon points="664.0,178.0 654.0,173.0 654.0,183.0" fill="#475569"/>
  <text x="48" y="253" class="label" text-anchor="start">実際の代入先の添字は、待機の後に評価します。</text>
  <text x="32" y="296" class="node-title" text-anchor="start">イベント制御付きNBA</text>
  <rect x="24" y="308" width="912" height="174" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g class="node" id="nba-0">
    <rect x="48" y="322" width="248" height="106" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="172.0" y="350" class="node-title" text-anchor="middle">右辺と代入先を捕捉</text>
  <text x="172.0" y="376" class="body" text-anchor="middle">右辺・代入先・イベント制御</text>
  <text x="172.0" y="397" class="body" text-anchor="middle">を発行時に保持</text>
  </g>
  <g class="node" id="nba-1">
    <rect x="356" y="322" width="248" height="106" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="480.0" y="350" class="node-title" text-anchor="middle">独立した保留処理</text>
  <text x="480.0" y="376" class="body" text-anchor="middle">値と待機を所有</text>
  <text x="480.0" y="397" class="body" text-anchor="middle">発行元から独立</text>
  </g>
  <g class="node" id="nba-2">
    <rect x="664" y="322" width="248" height="106" rx="7" fill="#eff6ff" stroke="#3b6f9e" stroke-width="1.3"/>
  <text x="788.0" y="350" class="node-title" text-anchor="middle">予約された更新</text>
  <text x="788.0" y="376" class="body" text-anchor="middle">捕捉済みの代入先と</text>
  <text x="788.0" y="397" class="body" text-anchor="middle">右辺を使う</text>
  </g>
  <path d="M 296 375 H 356" class="arrow"/>
  <polygon points="356.0,375.0 346.0,370.0 346.0,380.0" fill="#475569"/>
  <path d="M 604 375 H 664" class="arrow"/>
  <polygon points="664.0,375.0 654.0,370.0 654.0,380.0" fill="#475569"/>
  <path d="M 480 428 V 450 H 916" class="arrow"/>
  <polygon points="916.0,450.0 906.0,445.0 906.0,455.0" fill="#475569"/>
  <text x="700" y="472" class="label" text-anchor="middle">予約後、発行元プロセスは独立して続行</text>
  <text x="24" y="512" class="subtitle" text-anchor="start">繰り返し回数は1回だけ評価し、非正数・X/Zなら待機を省きます。型やソースの制限は本文を参照してください。</text>
</svg>
