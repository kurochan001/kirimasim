name: FST compression dependencies
description: Prepare system zlib/bzip2 development libraries for the pinned libfst build
runs:
  using: composite
  steps:
    - name: Prepare compression headers and libraries
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev libbz2-dev
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          xcrun --sdk macosx --show-sdk-path >/dev/null
        else
          echo "::error::FST dependency setup currently supports Linux and macOS"
          exit 1
        fi
