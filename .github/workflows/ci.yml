name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test (linux, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
    # The jobs run on the project's self-hosted Linux (x86-64) runner, which
    # carries the kirimasim-linux label. macOS results come from
    # tools/local_ci.py run before pushing. A pull request from a fork would
    # run its own code on that machine, so only pushes and pull requests from
    # branches of this repository run here; the repository also requires
    # approval before any workflow of an outside contributor runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, kirimasim-linux]
    steps:
      # The runner's home directory stays out of the public logs.
      - name: Mask the runner's home directory
        run: echo "::add-mask::$HOME"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version
          ninja --version
          python3 --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/*-src
            build/${{ matrix.preset }}/_deps/*-subbuild
            build/${{ matrix.preset }}/_deps/*-tmp
            build/${{ matrix.preset }}/CMakeFiles/fc-stamp
          key: fetchcontent-linux-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Check release optimization flags
        if: matrix.preset == 'release'
        run: python3 tools/check_release_flags.py

  lint:
    # The same rule as build-test: never a fork's code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, kirimasim-linux]
    steps:
      - name: Mask the runner's home directory
        run: echo "::add-mask::$HOME"

      # The full history is needed by the PR history checks below. The default
      # checkout of a pull_request event fetches only GitHub's test merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # LLVM 22, the same major version as the Homebrew LLVM used on the
      # development Mac, is installed on the runner from apt.llvm.org. The job
      # does not install it, because that would need sudo on the runner.
      - name: Show LLVM 22
        run: |
          clang-22 --version
          clang-tidy-22 --version
          clang-format-22 --version

      - name: Banned features and test-suite knowledge in src
        run: python3 tools/check_banned.py

      - name: Expectation files without their test
        run: python3 tools/check_suite_files.py

      - name: clang-format
        run: git ls-files '*.cpp' '*.h' | xargs clang-format-22 --dry-run --Werror

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dev/_deps/*-src
            build/dev/_deps/*-subbuild
            build/dev/_deps/*-tmp
            build/dev/CMakeFiles/fc-stamp
          key: fetchcontent-lint-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure for clang-tidy
        env:
          CC: clang-22
          CXX: clang++-22
        run: cmake --preset dev

      # slang generates some of its headers at build time; build slang first so
      # that clang-tidy can see them.
      - name: Build slang
        run: cmake --build --preset dev --target slang_slang

      - name: clang-tidy
        run: git ls-files 'src/*.cpp' 'tests/*.cpp' | xargs clang-tidy-22 -p build/dev --quiet

      - name: Expected-value changes stay out of implementation PRs
        if: github.event_name == 'pull_request'
        run: >
          python3 tools/check_expected_change.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
