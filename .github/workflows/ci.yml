name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test (linux, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
    # GitHub's Linux (x86-64) runners; the macos job below covers macOS.
    runs-on: ubuntu-24.04
    # The compiler is named here rather than taken from the runner's default
    # c++, so that the build uses LLVM 22, the version lint uses and the
    # development Mac has.
    env:
      CC: clang-22
      CXX: clang++-22
      # Warnings in kirimasim's own code are errors with clang.
      WERROR: -DKIRIMASIM_WERROR=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 22 (apt.llvm.org packages)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Show tool versions
        run: |
          "$CXX" --version
          cmake --version
          ninja --version
          python3 --version

      # The keys name the runner image: a cache saved on another machine holds
      # that machine's paths, which stop the configure step.
      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/*-src
            build/${{ matrix.preset }}/_deps/*-subbuild
            build/${{ matrix.preset }}/_deps/*-tmp
            build/${{ matrix.preset }}/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-clang22-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ env.WERROR }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --output-junit "$GITHUB_WORKSPACE/build/ctest-junit.xml"

      # The counts of the READMEs, from the tests of the dev configuration
      # (tools/readme_counts.py, docs/counts.json).
      - name: README counts
        if: matrix.preset == 'dev'
        run: python3 tools/readme_counts.py check --build build/dev --junit build/ctest-junit.xml

      - name: Check release optimization flags
        if: matrix.preset == 'release'
        run: python3 tools/check_release_flags.py

  # The sanitizers on every push, with the runner's own compiler (GCC):
  # GCC evaluates function arguments in another order than clang, which is
  # how the nightly asan job found a reference into a table that lowering
  # had moved (2026-10-17). The nightly workflow runs them on macOS too.
  sanitizers:
    name: sanitizers (linux, gcc, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/*-src
            build/${{ matrix.preset }}/_deps/*-subbuild
            build/${{ matrix.preset }}/_deps/*-tmp
            build/${{ matrix.preset }}/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # The Context tests under ThreadSanitizer (RUNTIME_ABI.md 9.8; the tsan
  # preset builds and runs only them), with clang 22 as in build-test.
  # front_parallel is left out until slang's Driver no longer writes its
  # process-wide colour flags when it is made, which ThreadSanitizer
  # reports when two fronts run at once (RUNTIME_ABI.md 9.7, #32); the
  # nightly workflow runs it.
  tsan:
    name: tsan (linux, clang-22)
    runs-on: ubuntu-24.04
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 22 (apt.llvm.org packages)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Show tool versions
        run: |
          "$CXX" --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tsan/_deps/*-src
            build/tsan/_deps/*-subbuild
            build/tsan/_deps/*-tmp
            build/tsan/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-clang22-tsan-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset tsan -DKIRIMASIM_WERROR=ON

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        run: ctest --preset tsan --output-on-failure -E front_parallel

  # GitHub's standard macOS (arm64) runners, which this public repository
  # can use, with the runner's Apple clang: the platform of the development
  # Mac. tools/local_ci.py still runs the same checks before a push.
  macos:
    name: macos (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, asan, ubsan]
    runs-on: macos-26
    env:
      WERROR: -DKIRIMASIM_WERROR=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version
          python3 --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/*-src
            build/${{ matrix.preset }}/_deps/*-subbuild
            build/${{ matrix.preset }}/_deps/*-tmp
            build/${{ matrix.preset }}/CMakeFiles/fc-stamp
          key: fetchcontent-macos-26-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ env.WERROR }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Check release optimization flags
        if: matrix.preset == 'release'
        run: python3 tools/check_release_flags.py

  # The oldest compilers kirimasim is said to build with (README,
  # "Building"): GCC 13 with its own libstdc++, Clang 18 with libc++ 18,
  # Clang 19 with libstdc++ 13, and Apple clang 17 from the oldest Xcode on
  # the macOS runner. Older Clang cannot build slang as C++23 (tried
  # 2026-10-21): with libstdc++ 13, Clang 17 and 18 stop where slang's
  # expected-lite turns to a std::expected that libstdc++ does not give
  # them, and libc++ 17 lacks std::views::join. The Linux runner has GCC 13
  # and Clang 18; Clang 19 comes from apt.llvm.org, and libc++ 18 from
  # Ubuntu's packages. Warnings are not errors here, as older compilers warn
  # of other things.
  min-compilers:
    name: min-compilers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-13
            id: gcc13
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - name: clang-18, libc++ 18
            id: clang18-libcxx18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            cxxflags: -stdlib=libc++
            packages: libc++-18-dev libc++abi-18-dev
          - name: clang-19, libstdc++ 13
            id: clang19-libstdcxx13
            os: ubuntu-24.04
            llvm: 19
            cc: clang-19
            cxx: clang++-19
            cxxflags: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13
          - name: apple-clang-17, Xcode 26.0.1
            id: appleclang17
            os: macos-26
            cc: clang
            cxx: clang++
            developer_dir: /Applications/Xcode_26.0.1.app/Contents/Developer
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM (apt.llvm.org packages)
        if: matrix.llvm
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}

      - name: Install the standard library
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Use the Xcode named
        if: matrix.developer_dir
        run: echo "DEVELOPER_DIR=${{ matrix.developer_dir }}" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          "$CXX" --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dev/_deps/*-src
            build/dev/_deps/*-subbuild
            build/dev/_deps/*-tmp
            build/dev/CMakeFiles/fc-stamp
          key: fetchcontent-${{ matrix.os }}-min-${{ matrix.id }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev --output-on-failure

  lint:
    runs-on: ubuntu-24.04
    steps:
      # The full history is needed by the PR history checks below. The default
      # checkout of a pull_request event fetches only GitHub's test merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # LLVM 22, the same major version as the Homebrew LLVM used on the
      # development Mac, from apt.llvm.org.
      - name: Install LLVM 22 (apt.llvm.org packages)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22 clang-format-22
          clang-22 --version
          clang-tidy-22 --version
          clang-format-22 --version

      - name: Banned features and test-suite knowledge in src
        run: python3 tools/check_banned.py

      - name: Copyright and SPDX lines of the code
        run: python3 tools/check_spdx.py

      - name: Expectation files without their test
        run: python3 tools/check_suite_files.py

      - name: clang-format
        run: git ls-files '*.cpp' '*.h' | xargs clang-format-22 --dry-run --Werror

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dev/_deps/*-src
            build/dev/_deps/*-subbuild
            build/dev/_deps/*-tmp
            build/dev/CMakeFiles/fc-stamp
          key: fetchcontent-lint-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure for clang-tidy
        env:
          CC: clang-22
          CXX: clang++-22
        run: cmake --preset dev

      # slang generates some of its headers at build time; build slang first so
      # that clang-tidy can see them.
      - name: Build slang
        run: cmake --build --preset dev --target slang_slang

      # --experimental-custom-checks runs custom-kirimasim-global-state of
      # .clang-tidy (RUNTIME_ABI.md 9.3); without it, clang-tidy skips that
      # check without a word. The next step shows on a probe that this
      # clang-tidy reports what the check must.
      # tests/fuzz/ is built by the fuzz preset only, so the dev build has no
      # compile command for it.
      - name: clang-tidy
        run: >
          git ls-files 'src/*.cpp' 'tests/*.cpp' ':!tests/fuzz/*'
          | xargs clang-tidy-22 --experimental-custom-checks -p build/dev --quiet

      - name: Global state and its allowlist
        run: python3 tools/check_global_state.py --clang-tidy clang-tidy-22

      - name: Expected-value changes stay out of implementation PRs
        if: github.event_name == 'pull_request'
        run: >
          python3 tools/check_expected_change.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

      # A push to main has no PR, so each pushed commit is checked on its own:
      # a commit may change the implementation or existing expectations, not
      # both. A push that creates the branch has no previous commit to start
      # from and is left out.
      - name: Expected-value changes stay out of implementation commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          for c in $(git rev-list --reverse "$BEFORE..$AFTER"); do
            echo "commit $c"
            python3 tools/check_expected_change.py --base "$c^" --head "$c"
          done
