name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"  # once a day (18:17 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: sanitizers (${{ matrix.os }}, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
        preset: [asan, ubsan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/*-src
            build/${{ matrix.preset }}/_deps/*-subbuild
            build/${{ matrix.preset }}/_deps/*-tmp
            build/${{ matrix.preset }}/CMakeFiles/fc-stamp
          key: fetchcontent-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # The unit tests in one process, in shuffled orders, three times over
      # (TEST_SUITE.md, list of required tests; RUNTIME_ABI.md 9.8): state
      # that one test leaves behind shows in another. gtest prints the seed
      # of each round; the first is the day of the year.
      - name: Unit tests shuffled in one process
        run: >
          build/${{ matrix.preset }}/tests/unit/kirimasim_unit_tests
          --gtest_shuffle --gtest_repeat=3 --gtest_random_seed="$(date -u +%j)"

  # The Context tests under ThreadSanitizer (RUNTIME_ABI.md 9.8), all of
  # them: ci.yml leaves out front_parallel, which fails while slang's
  # Driver writes its process-wide colour flags when it is made
  # (RUNTIME_ABI.md 9.7, #32). Linux uses clang 22, as ci.yml does.
  tsan:
    name: tsan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            cc: cc
            cxx: c++
          - os: ubuntu-24.04
            cc: clang-22
            cxx: clang++-22
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 22 (apt.llvm.org packages)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Show tool versions
        run: |
          "$CXX" --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tsan/_deps/*-src
            build/tsan/_deps/*-subbuild
            build/tsan/_deps/*-tmp
            build/tsan/CMakeFiles/fc-stamp
          key: fetchcontent-${{ matrix.os }}-${{ matrix.cc }}-tsan-${{ hashFiles('cmake/Dependencies.cmake') }}

      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - run: ctest --preset tsan --output-on-failure

  linux-arm64:
    # ubuntu-24.04-arm is a standard GitHub-hosted arm64 runner for public
    # repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dev/_deps/*-src
            build/dev/_deps/*-subbuild
            build/dev/_deps/*-tmp
            build/dev/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-arm-dev-${{ hashFiles('cmake/Dependencies.cmake') }}

      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure

  # The newest compilers named in the design. Not part of the required
  # checks yet: move a job to ci.yml once it has been green for a while.
  gcc-16:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GCC 16 (Ubuntu universe package)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16
          g++-16 --version
          cmake --version

      - run: cmake --preset dev
        env:
          CC: gcc-16
          CXX: g++-16
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure

  clang-23:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang 23 (apt.llvm.org packages of the LLVM 23 release)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          clang++-23 --version
          cmake --version

      - run: cmake --preset dev
        env:
          CC: clang-23
          CXX: clang++-23
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure

  # C++26. kirimasim is C++23 and uses no C++26 feature (CLAUDE.md); it moves
  # once the compilers it supports all have C++26. Until then this job builds
  # and tests it as C++26 with GCC 16 and with clang 22, the compiler of
  # ci.yml, to show what the move would meet. A failure here does not fail
  # the nightly run.
  cxx26:
    name: cxx26 (${{ matrix.compiler }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-16
            os: ubuntu-26.04
            cc: gcc-16
            cxx: g++-16
          - compiler: clang-22
            os: ubuntu-24.04
            cc: clang-22
            cxx: clang++-22
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GCC 16 (Ubuntu universe package)
        if: matrix.compiler == 'gcc-16'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16

      - name: Install LLVM 22 (apt.llvm.org packages)
        if: matrix.compiler == 'clang-22'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Show tool versions
        run: |
          "$CXX" --version
          cmake --version

      - run: cmake --preset dev -DCMAKE_CXX_STANDARD=26
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure

  # The P1 gates of TEST_SUITE.md ("How the P1 passing conditions are
  # measured"). The tables go to the job summary. Gates that are not met yet
  # do not fail the job; the decision is made at the end of P1 (M8).
  p1-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
            build/release/_deps/*-tmp
            build/release/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-release-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache the Icarus build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kirimasim
          key: icarus-${{ hashFiles('tools/build_icarus.sh') }}

      - name: Install the tools to build Icarus
        run: sudo apt-get update && sudo apt-get install -y autoconf gperf bison flex

      - run: cmake --preset release
      - run: cmake --build --preset release

      # valsem gate: the fuzzers at 100 times their size, seeded by the date.
      - name: Fuzz against valsem and the reference scheduler
        run: |
          KIRIMA_FUZZ_SCALE=100 KIRIMA_FUZZ_SEED=$(date -u +%Y%m%d) \
            build/release/tests/unit/kirimasim_unit_tests \
            --gtest_filter='W4Ops.*:Valsem.*:Scheduler.*'

      # sv-tests gate: the pinned sv-tests commit with its UVM submodule.
      - name: sv-tests against Icarus
        run: |
          iverilog=$(tools/build_icarus.sh)
          git init -q sv-tests
          git -C sv-tests fetch -q --depth 1 https://github.com/chipsalliance/sv-tests.git \
            15490e95fd978ada1c1dc59b7c4b53a7edb23b78
          git -C sv-tests checkout -q FETCH_HEAD
          git -C sv-tests submodule update -q --init --depth 1 third_party/tests/uvm
          python3 tools/svtests.py --sv-tests sv-tests --kirimasim build/release/src/driver/kirimasim \
            --iverilog "$iverilog" --out build/svtests | tee -a "$GITHUB_STEP_SUMMARY"

      # The other sv-tests, without simulation, read by kirimasim parse: no
      # gate, a warning when fewer pass than tests/gates/svtests_parse.txt,
      # so that a change of slang or of how kirimasim reads its options that
      # stops reading valid sources is seen.
      - name: sv-tests without simulation, read by kirimasim parse
        run: |
          python3 tools/svtests.py --sv-tests sv-tests --kirimasim build/release/src/driver/kirimasim \
            --parse-only --baseline tests/gates/svtests_parse.txt --out build/svtests-parse \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Own-suite gate: the test-suite repository is public, so it is cloned
      # without a token, at the commit the first line of the list names.
      # The first three lines go to the step summary. The first 20 failing
      # tests run once more, each in a group of the log, to show the
      # comparison that failed.
      - name: Own suite, P1 population
        run: |
          commit=$(head -1 tests/gates/p1_population.txt | sed -n 's/.*kirimasim-tests \([0-9a-f]*\),.*/\1/p')
          git clone -q https://github.com/kurochan001/kirimasim-tests.git suite
          git -C suite checkout -q "$commit"
          python3 tools/p1_population.py run --tests-repo suite \
            --kirimasim build/release/src/driver/kirimasim > build/p1_population.out || true
          head -3 build/p1_population.out | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n +4 build/p1_population.out
          grep -m 20 '^FAIL ' build/p1_population.out | while read -r _ t; do
            echo "::group::$t"
            python3 tools/run_suite_test.py --kirimasim build/release/src/driver/kirimasim "suite/tests/$t.sv" || true
            echo "::endgroup::"
          done || true

      # The counts of the READMEs against what this run measured: sv-tests
      # (with Icarus) on Linux and the own suite's P1 population
      # (tools/readme_counts.py, docs/counts.json). It fails when they differ.
      - name: README counts
        run: |
          python3 tools/readme_counts.py check --svtests build/svtests/results.json --os linux \
            --population build/p1_population.out

      # Every test of the suite's latest main, so that tests added after the
      # population was chosen run too. Reported only: not a gate, and the
      # gate figure in the line it prints does not apply. Failures are shown
      # as in the step before. The suite's tests are its test_*.sv files; its
      # other .sv files are sources that tests name in :files: (TEST_SUITE.md).
      - name: Own suite, latest main, every test (report only)
        run: |
          git -C suite checkout -q origin/main
          { echo "# every test of kirimasim-tests $(git -C suite rev-parse --short=12 HEAD), report only"
            (cd suite/tests && find . -name 'test_*.sv' | sed 's|^\./||; s|\.sv$||' | LC_ALL=C sort)
          } > build/suite_all.txt
          python3 tools/p1_population.py run --tests-repo suite --list build/suite_all.txt \
            --kirimasim build/release/src/driver/kirimasim > build/suite_all.out || true
          head -3 build/suite_all.out | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n +4 build/suite_all.out
          grep -m 20 '^FAIL ' build/suite_all.out | while read -r _ t; do
            echo "::group::$t"
            python3 tools/run_suite_test.py --kirimasim build/release/src/driver/kirimasim "suite/tests/$t.sv" || true
            echo "::endgroup::"
          done || true

  # The sv-tests gate on macOS (TEST_SUITE.md, "As many as Icarus or more"):
  # some tests depend on the C library, so each OS is measured against an
  # Icarus built there by the same procedure, and the READMEs keep both
  # counts.
  svtests-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
            build/release/_deps/*-tmp
            build/release/CMakeFiles/fc-stamp
          key: fetchcontent-macos-26-release-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache the Icarus build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kirimasim
          key: icarus-macos-26-${{ hashFiles('tools/build_icarus.sh') }}

      # tools/build_icarus.sh takes Homebrew's bison and flex, newer than
      # the system's.
      - name: Install the tools to build Icarus
        run: brew install autoconf gperf bison flex

      - run: cmake --preset release
      - run: cmake --build --preset release

      - name: sv-tests against Icarus
        run: |
          iverilog=$(tools/build_icarus.sh)
          git init -q sv-tests
          git -C sv-tests fetch -q --depth 1 https://github.com/chipsalliance/sv-tests.git \
            15490e95fd978ada1c1dc59b7c4b53a7edb23b78
          git -C sv-tests checkout -q FETCH_HEAD
          git -C sv-tests submodule update -q --init --depth 1 third_party/tests/uvm
          python3 tools/svtests.py --sv-tests sv-tests --kirimasim build/release/src/driver/kirimasim \
            --iverilog "$iverilog" --out build/svtests | tee -a "$GITHUB_STEP_SUMMARY"

      - name: README counts
        run: python3 tools/readme_counts.py check --svtests build/svtests/results.json --os macos

  # Wall-clock benchmarks (PERFORMANCE.md 5.1): the build time of
  # kirimasim and tools/bench.py on bench/, compared by
  # tools/bench_report.py with the median of the last seven nights, whose
  # records come from their artifacts. A value worse than its limit gets a
  # warning in the summary; nothing fails, as shared runners swing widely.
  bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
            build/release/_deps/*-tmp
            build/release/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-release-${{ hashFiles('cmake/Dependencies.cmake') }}

      - run: cmake --preset release
      # slang first, so that the time is that of kirimasim's own code.
      - run: cmake --build --preset release --target slang_slang

      - name: Build kirimasim, timed
        run: |
          start=$(date +%s.%N)
          cmake --build --preset release --target kirimasim
          end=$(date +%s.%N)
          echo "BUILD_SECONDS=$(python3 -c "print(round($end - $start, 2))")" >> "$GITHUB_ENV"

      - name: Run the benchmarks
        run: python3 tools/bench.py --kirimasim build/release/src/driver/kirimasim --out build/bench

      # A night without a record (its job failed, or the artifact expired)
      # is skipped.
      - name: Fetch the records of the last seven nights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/bench-history
          found=0
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml \
                        --branch main --limit 30 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name bench \
                 --dir "build/bench-history/$id" 2>/dev/null; then
              found=$((found + 1))
              [ "$found" -ge 7 ] && break
            fi
          done
          echo "records of earlier nights: $found"

      - name: Compare with the last nights
        run: >
          python3 tools/bench_report.py --results build/bench/results.json
          --build-seconds "$BUILD_SECONDS" --commit "$GITHUB_SHA"
          --out build/bench/nightly.json --history build/bench-history
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep this night's record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: |
            build/bench/nightly.json
            build/bench/summary.md
          retention-days: 30

  # Negative controls (TEST_SUITE.md): each known mistake put into the
  # sources must make some test fail. Four jobs share the list
  # (tools/mutants.py --shard), as one job would take hours and grows with
  # every mistake added.
  mutants:
    name: mutants (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dev/_deps/*-src
            build/dev/_deps/*-subbuild
            build/dev/_deps/*-tmp
            build/dev/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-dev-${{ hashFiles('cmake/Dependencies.cmake') }}

      - run: cmake --preset dev
      - run: cmake --build --preset dev
      # bash runs with pipefail, so a surviving mutant fails the step even
      # though tee, the last command of the pipe, succeeds. -u writes each
      # mutant's line at once, so the log shows how far a stopped run got.
      - shell: bash
        run: >
          python3 -u tools/mutants.py --preset dev --shard ${{ matrix.shard }}/4
          | tee -a "$GITHUB_STEP_SUMMARY"

  slang-main:
    # Watches slang's main branch: builds kirimasim against its latest
    # commit and runs the tests, so that an upstream change that would
    # break kirimasim is seen before the pinned commit moves
    # (cmake/Dependencies.cmake). A failure here holds nothing back.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version

      - name: Fetch slang's main branch
        run: |
          git clone --depth 1 https://github.com/MikePopoloski/slang.git "$RUNNER_TEMP/slang"
          git -C "$RUNNER_TEMP/slang" log -1 --format='slang main: %H %cs %s'

      - run: cmake --preset dev -DFETCHCONTENT_SOURCE_DIR_SLANG="$RUNNER_TEMP/slang"
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure
