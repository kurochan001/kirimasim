name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"  # once a day (18:17 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: sanitizers (${{ matrix.os }}, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
        preset: [asan, ubsan]
    runs-on: ${{ matrix.os }}
    # See ci.yml: macOS runs locally with tools/local_ci.py for now.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/*-src
            build/${{ matrix.preset }}/_deps/*-subbuild
            build/${{ matrix.preset }}/_deps/*-tmp
            build/${{ matrix.preset }}/CMakeFiles/fc-stamp
          key: fetchcontent-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure

  linux-arm64:
    # ubuntu-24.04-arm is a standard GitHub-hosted arm64 runner for public
    # repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          c++ --version
          cmake --version

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dev/_deps/*-src
            build/dev/_deps/*-subbuild
            build/dev/_deps/*-tmp
            build/dev/CMakeFiles/fc-stamp
          key: fetchcontent-ubuntu-24.04-arm-dev-${{ hashFiles('cmake/Dependencies.cmake') }}

      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure

  # The newest compilers named in the design. Not part of the required
  # checks yet: move a job to ci.yml once it has been green for a while.
  gcc-16:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GCC 16 (Ubuntu universe package)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16
          g++-16 --version
          cmake --version

      - run: cmake --preset dev
        env:
          CC: gcc-16
          CXX: g++-16
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure

  clang-23:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang 23 (apt.llvm.org packages of the LLVM 23 release)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          clang++-23 --version
          cmake --version

      - run: cmake --preset dev
        env:
          CC: clang-23
          CXX: clang++-23
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure
